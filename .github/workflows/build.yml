name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.build-type }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake

      - name: Configure
        run: |
          cmake -S . -B build -G "Unix Makefiles" \
            -DCOLPACK_BUILD_ALL_EXAMPLES=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix install

      # Build a downstream project against the installed package.
      - name: Test find_package
        run: |
          cmake -S test/consumer -B build-find-package -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_PREFIX_PATH=$PWD/install
          cmake --build build-find-package
          ctest --test-dir build-find-package --output-on-failure

      # Include ColPack with add_subdirectory(), as OpenModelica does.
      - name: Test add_subdirectory
        run: |
          cmake -S test/consumer -B build-add-subdirectory -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCOLPACK_SOURCE_DIR=$PWD
          cmake --build build-add-subdirectory
          ctest --test-dir build-add-subdirectory --output-on-failure

  windows:
    name: Windows UCRT64 (${{ matrix.build-type }})
    runs-on: windows-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        build-type: [Release]

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 #v2.32.0
        with:
          msystem: UCRT64
          update: true
          # "MSYS Makefiles" drives /usr/bin/make from the MSYS subsystem, so
          # that one is not a pacboy (:p / UCRT64) package.
          install: >-
            make
          # :p expands to the mingw-w64-ucrt-x86_64-* package of the same name.
          pacboy: >-
            toolchain:p
            cmake:p

      - name: Configure
        run: |
          cmake -S . -B build -G "MSYS Makefiles" \
            -DCOLPACK_BUILD_ALL_EXAMPLES=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix install

      # Build a downstream project against the installed package.
      - name: Test find_package
        run: |
          cmake -S test/consumer -B build-find-package -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_PREFIX_PATH=$(cygpath -m "$PWD/install")
          cmake --build build-find-package
          ctest --test-dir build-find-package --output-on-failure

      # Include ColPack with add_subdirectory(), as OpenModelica does.
      - name: Test add_subdirectory
        run: |
          cmake -S test/consumer -B build-add-subdirectory -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCOLPACK_SOURCE_DIR=$(cygpath -m "$PWD")
          cmake --build build-add-subdirectory
          ctest --test-dir build-add-subdirectory --output-on-failure

  macos:
    name: macOS (${{ matrix.build-type }})
    runs-on: macos-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        build-type: [Release]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      # Apple clang supports OpenMP but does not ship the runtime or <omp.h>.
      - name: Install dependencies
        run: brew install libomp

      - name: Configure
        run: |
          cmake -S . -B build -G "Unix Makefiles" \
            -DCOLPACK_BUILD_ALL_EXAMPLES=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DOpenMP_ROOT=$(brew --prefix libomp)

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix install

      # Build a downstream project against the installed package.
      - name: Test find_package
        run: |
          cmake -S test/consumer -B build-find-package -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_PREFIX_PATH=$PWD/install \
            -DOpenMP_ROOT=$(brew --prefix libomp)
          cmake --build build-find-package
          ctest --test-dir build-find-package --output-on-failure

      # Include ColPack with add_subdirectory(), as OpenModelica does.
      - name: Test add_subdirectory
        run: |
          cmake -S test/consumer -B build-add-subdirectory -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCOLPACK_SOURCE_DIR=$PWD \
            -DOpenMP_ROOT=$(brew --prefix libomp)
          cmake --build build-add-subdirectory
          ctest --test-dir build-add-subdirectory --output-on-failure
